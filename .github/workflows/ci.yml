name: ci

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck + bash -n
        run: make lint

  meta-lint:
    # Structural lint of the repo's own automation + docs.
    # actionlint + yamllint gate; markdownlint + external links advisory
    # (consistent with the repo's "warnings are surfaces, not gates" policy).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (workflows)
        run: docker run --rm -v "$PWD:/w" -w /w rhysd/actionlint:latest -color
      - name: yamllint (.github)
        run: docker run --rm -v "$PWD:/w" -w /w cytopia/yamllint:latest -c .yamllint -f parsable .github
      - name: markdownlint (advisory)
        continue-on-error: true
        run: docker run --rm -v "$PWD:/w" -w /w davidanson/markdownlint-cli2:v0.17.2
      - name: lychee - internal links (blocking; never flaky)
        run: |
          docker run --rm -v "$PWD:/tmp/repo" lycheeverse/lychee:latest             --offline --no-progress '/tmp/repo/**/*.md'
      - name: lychee - external links (advisory)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          docker run --rm -v "$PWD:/tmp/repo" lycheeverse/lychee:latest             --no-progress --max-retries 2 --timeout 15             --accept '200..=299,403,429,500..=599' '/tmp/repo/**/*.md'

  supply-chain:
    # Trivy surface-advisory scans (report to the GitHub Security tab without
    # blocking the build while the baseline is being accepted). Run `make scan`
    # locally for the strict HIGH/CRITICAL gate.
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: make image
      - name: Trivy image scan (advisory)
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: pi-sandbox:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Upload image scan SARIF
        if: ${{ hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
      - name: Trivy config scan (Dockerfile misconfig, advisory)
        # Table output to the log only (hadolint in `make lint` already gates
        # the Dockerfile); no SARIF upload for config findings here.
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: docker/Dockerfile.pi
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL


  invariants:
    # No Docker needed: asserts the committed results corpus still holds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert committed results satisfy their invariants
        run: make check

  sandbox:
    # Builds the image, regenerates the Docker probes, asserts both.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: make image
      - name: Bundled plugins load (9 checks)
        run: make verify
      - name: Unit-test the probe in a controlled container
        run: make test
      - name: Seed a fake host home (so the leaky 03 probe has secrets to expose)
        run: |
          mkdir -p ~/.pi/agent ~/.ssh
          echo '{}' > ~/.pi/agent/settings.json
          : > ~/.ssh/id_rsa
      - name: Regenerate Docker probe results (linux)
        run: make probes
      - name: Re-assert invariants (incl. fresh linux results)
        run: make check
      - name: Develop a skeleton-research repo inside the sandbox (make example)
        run: make example
      - name: Re-assert invariants after the research example
        run: make check
      - name: Upload fresh probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-results-linux
          path: results/*-linux-*.txt
          if-no-files-found: ignore
